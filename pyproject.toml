[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macpilot"
version = "0.8.0"
description = "Local-first file search and safe organization for macOS"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
macpilot = "macpilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["macpilot*"]
